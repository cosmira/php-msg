name: Quality Assurance

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/**'
      - '**.php'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'

jobs:
  composer:
    name: composer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock 👀
        run: composer validate

      - name: Install dependencies
        run: composer install --no-progress --no-suggest

      - name: Check for outdated dependencies
        run: |
          if [ -n "$(composer outdated --direct --no-dev)" ]; then
            echo "❌ There are outdated dependencies!"
            composer outdated --direct
            exit 1
          fi
        shell: bash

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none
          ini-values: memory_limit=1G
          tools: composer:v2

      - name: Install Dependencies 🔧
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run phpstan
        run: vendor/bin/phpstan analyse --no-progress

  rector:
    name: rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none
          tools: composer:v2

      - name: Install Dependencies 🔧
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run rector
        run: vendor/bin/rector process --dry-run

  soda:
    name: Soda
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout Soda
        uses: actions/checkout@v7
        with:
          repository: cosmira/soda
          ref: 55d673dfbd6eda18088e5b4a1e5c1ecf0885289a
          path: .tools/soda
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Soda dependencies
        run: composer install --working-dir=.tools/soda --no-dev --prefer-dist --no-interaction --no-progress

      - name: Verify exception policy
        run: php .github/test-soda-policy.php

      - name: Check source and PHPDoc contracts
        run: composer test:soda
