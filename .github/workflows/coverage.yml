name: Code Coverage

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/**'
      - '**.php'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'

jobs:
  phpunit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: pcov
          tools: composer:v2

      - name: Install Dependencies 🔧
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run tests with coverage 🧪
        run: |
          vendor/bin/phpunit \
            --coverage-clover=coverage.xml \
            --coverage-html=coverage-html \
            --coverage-text \
            --colors=never

      - name: Extract coverage %
        id: coverage
        run: |
          COVERAGE=$(php -r '
            $xml = simplexml_load_file("coverage.xml");
            if ($xml === false || ! isset($xml->project->metrics)) {
                fwrite(STDERR, "Unable to read coverage metrics from coverage.xml\n");
                exit(1);
            }

            $statements = (int) $xml->project->metrics["statements"];
            $covered = (int) $xml->project->metrics["coveredstatements"];

            if ($statements <= 0) {
                fwrite(STDERR, "Invalid statement count in coverage.xml\n");
                exit(1);
            }

            echo (string) intdiv($covered * 100, $statements);
          ')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Upload coverage report 📦
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-html

      - name: Add summary 📊
        run: |
          echo "## 🧪 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage: **${{ steps.coverage.outputs.coverage }}%**" >> $GITHUB_STEP_SUMMARY
          echo "Threshold: **80%**" >> $GITHUB_STEP_SUMMARY

      - name: Check coverage threshold 🚦
        run: |
          if [ ${{ steps.coverage.outputs.coverage }} -lt 80 ]; then
            echo "Coverage is too low: ${{ steps.coverage.outputs.coverage }}%"
            exit 1
          fi
