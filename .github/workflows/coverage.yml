name: Code Coverage

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/**'
      - '**.php'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'

jobs:
  phpunit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: pcov
          tools: composer:v2

      - name: Install Dependencies 🔧
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run tests with coverage 🧪
        run: |
          vendor/bin/phpunit \
            --coverage-clover=coverage.xml \
            --coverage-html=coverage-html \
            --coverage-text \
            --colors=never

      - name: Extract coverage %
        id: coverage
        run: |
          PERCENT=$(grep -oP 'line-rate="\K[0-9.]+' coverage.xml | head -1)
          COVERAGE=$(echo "$PERCENT * 100" | bc | cut -d'.' -f1)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Check coverage threshold 🚦
        run: |
          if [ ${{ steps.coverage.outputs.coverage }} -lt 80 ]; then
            echo "Coverage is too low: ${{ steps.coverage.outputs.coverage }}%"
            exit 1
          fi

      - name: Upload coverage report 📦
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html

      - name: Add summary 📊
        run: |
          echo "## 🧪 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage: **${{ steps.coverage.outputs.coverage }}%**" >> $GITHUB_STEP_SUMMARY